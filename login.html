<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AV Fitness | Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b0b;
            color: white;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #151515;
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #292929;
            box-shadow: 0 15px 50px rgba(0,0,0,.4);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #ff3b30;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 7px;
            color: white;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #ff3b30;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #ff3b30;
            border: none;
            border-radius: 7px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ff6259;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            color: #ff8a83;
            min-height: 20px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #aaa;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            AV <span>FITNESS</span>
        </div>

        <p class="subtitle">
            Member Login
        </p>

        <form id="loginForm">

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <a href="index.html" class="back">
            ← Back to AV Fitness
        </a>
        
        <a href="admin.html" class="back">
            Admin Login
        </a>
    </div>

    <script>
        const SUPABASE_URL = "https://hwcvzgnldnnvpzqaprmr.supabase.co";
        const SUPABASE_KEY = "sb_publishable__p2vDp05-aQKlAjGbp8vqw_7c9fyHtK";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            message.textContent = "Logging in...";

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {
                message.textContent = error.message;
                return;
            }

            // Check the user's role

const {
    data: role,
    error: roleError
} = await supabaseClient
    .from("user_roles")
    .select("role")
    .eq("user_id", data.user.id)
    .maybeSingle();


if (roleError) {

    console.error("ROLE ERROR:", roleError);

    message.textContent =
        "Role error: " + roleError.message;

    return;
}

if (!role) {

    console.log("No role found for this user.");

    message.textContent =
        "No role found for this account.";

    return;
}

console.log("Logged in user role:", role.role);

if (role && role.role === "admin") {

    window.location.href = "admin.html";

} else {

    window.location.href = "dashboard.html";

}
    </script>

</body>
</html>
