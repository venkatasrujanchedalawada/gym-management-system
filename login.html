<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MJ Fitness | Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --yellow:#ffd400;
    --yellow-hover:#ffe45c;
    --black:#070707;
    --panel:#121212;
    --card:#171717;
    --border:#2a2a2a;
    --muted:#999;
    --white:#fff;
    --danger:#ff6b6b;
    --success:#8ee28e;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:var(--white);
    background:
        radial-gradient(circle at 50% 35%,rgba(255,212,0,.12),transparent 32%),
        linear-gradient(135deg,#151515 0%,var(--black) 65%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.login-page{
    width:100%;
    max-width:440px;
}

.brand{
    text-align:center;
    margin-bottom:22px;
}

.brand-name{
    font-size:32px;
    font-weight:950;
    letter-spacing:-1px;
}

.brand-name span{color:var(--yellow)}

.tagline{
    color:#888;
    font-size:14px;
    margin-top:5px;
}

.login-card{
    background:rgba(23,23,23,.96);
    border:1px solid var(--border);
    border-radius:18px;
    padding:34px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.login-card h1{
    text-align:center;
    font-size:27px;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    color:var(--muted);
    margin-bottom:28px;
    font-size:15px;
}

.field{margin-bottom:18px}

label{
    display:block;
    margin-bottom:8px;
    color:#ddd;
    font-size:14px;
    font-weight:700;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #333;
    border-radius:8px;
    background:#0b0b0b;
    color:#fff;
    outline:none;
    font-size:15px;
    transition:.2s;
}

input:focus{
    border-color:var(--yellow);
    box-shadow:0 0 0 2px rgba(255,212,0,.08);
}

input::placeholder{color:#666}

.login-button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    background:var(--yellow);
    color:#050505;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
    margin-top:4px;
}

.login-button:hover{background:var(--yellow-hover);transform:translateY(-1px)}

.login-button:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
}

#message{
    min-height:22px;
    text-align:center;
    margin-top:17px;
    font-size:14px;
    color:var(--muted);
}

#message.error{color:var(--danger)}
#message.success{color:var(--success)}

.back{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#999;
    text-decoration:none;
    font-size:14px;
}

.back:hover{color:var(--yellow)}

.footer{
    text-align:center;
    color:#555;
    font-size:12px;
    margin-top:20px;
}

@media(max-width:480px){
    body{padding:16px}
    .login-card{padding:26px 20px}
    .brand-name{font-size:28px}
}
</style>
</head>

<body>

<main class="login-page">

    <div class="brand">
        <div class="brand-name">MJ <span>FITNESS</span></div>
        <div class="tagline">Get Fit. Don't Quit.</div>
    </div>

    <section class="login-card">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Member &amp; Admin Login
        </p>

        <form id="loginForm">

            <div class="field">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                type="submit"
                id="loginButton"
                class="login-button"
            >
                Login
            </button>

        </form>

        <p id="message" aria-live="polite"></p>

    </section>

    <a href="index.html" class="back">
        ← Back to MJ Fitness
    </a>

    <div class="footer">
        © 2026 MJ Fitness
    </div>

</main>

<script>
/*
    IMPORTANT:
    Replace these with the SAME Supabase URL and
    publishable/anon key used by your working project.

    Never put the Supabase service-role/secret key here.
*/
const SUPABASE_URL = "https://hwcvzgnldnnvpzqaprmr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable__p2vDp05-aQKlAjGbp8vqw_7c9fyHtK";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text, type=""){
    message.textContent = text;
    message.className = type;
}

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if(!email || !password){
        showMessage("Please enter your email and password.", "error");
        return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "Logging in...";
    showMessage("");

    try{
        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

        if(error) throw error;

        showMessage("Login successful. Redirecting...", "success");

        /*
          Keep the redirect simple. The existing admin/member
          authorization logic can decide what the user sees.
        */
        setTimeout(() => {
            window.location.href = "admin.html";
        }, 500);

    }catch(error){
        console.error("Login error:", error);

        let text = error?.message || "Unable to log in.";

        if(text.toLowerCase().includes("invalid login credentials")){
            text = "Incorrect email or password.";
        }

        showMessage(text, "error");

        loginButton.disabled = false;
        loginButton.textContent = "Login";
    }
});
</script>

</body>
</html>
