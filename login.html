<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AV Fitness | Login</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0b0b0b;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;

            background: #151515;
            border: 1px solid #292929;

            border-radius: 15px;

            padding: 35px;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;

            margin-bottom: 10px;
        }

        .logo span {
            color: #ff3b30;
        }

        .subtitle {
            text-align: center;
            color: #999;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #ccc;
            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-bottom: 20px;

            background: #0d0d0d;
            color: white;

            border: 1px solid #333;
            border-radius: 7px;

            outline: none;
        }

        input:focus {
            border-color: #ff3b30;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 7px;

            background: #ff3b30;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #message {
            text-align: center;

            margin-top: 18px;

            color: #aaa;

            min-height: 20px;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 25px;

            color: #aaa;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }

    </style>

</head>


<body>


<div class="login-box">

    <div class="logo">
        AV <span>FITNESS</span>
    </div>

    <p class="subtitle">
        Member & Admin Login
    </p>


    <form id="loginForm">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >


        <button
            type="submit"
            id="loginButton"
        >
            Login
        </button>

    </form>


    <p id="message"></p>


    <a
        href="index.html"
        class="back"
    >
        ← Back to AV Fitness
    </a>

</div>


<script>


/* =====================================================
   SUPABASE CONFIGURATION
   ===================================================== */


/*
   IMPORTANT:

   Put the SAME Supabase URL and
   PUBLISHABLE/ANON KEY that you
   were already using.

   Do NOT use the service_role key.
*/


const SUPABASE_URL =
    "https://hwcvzgnldnnvpzqaprmr.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable__p2vDp05-aQKlAjGbp8vqw_7c9fyHtK";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =====================================================
   LOGIN
   ===================================================== */


const loginForm =
    document.getElementById("loginForm");


const emailInput =
    document.getElementById("email");


const passwordInput =
    document.getElementById("password");


const loginButton =
    document.getElementById("loginButton");


const message =
    document.getElementById("message");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        if (!email || !password) {

            message.textContent =
                "Please enter your email and password.";

            return;
        }


        loginButton.disabled = true;

        message.textContent =
            "Logging in...";


        /* ---------------------------------------------
           STEP 1 — AUTHENTICATE
           --------------------------------------------- */


        const {
            data: authData,
            error: authError
        } =
            await supabaseClient.auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


        if (authError) {

            console.error(
                "LOGIN ERROR:",
                authError
            );


            message.textContent =
                "Login failed: " +
                authError.message;


            loginButton.disabled = false;

            return;
        }


        if (!authData.user) {

            message.textContent =
                "Login failed. User not found.";

            loginButton.disabled = false;

            return;
        }


        console.log(
            "Authenticated user:",
            authData.user.id
        );


        /* ---------------------------------------------
           STEP 2 — CHECK ROLE
           --------------------------------------------- */


        message.textContent =
            "Checking account type...";


        const {
            data: roleData,
            error: roleError
        } =
            await supabaseClient
                .from("user_roles")
                .select("role")
                .eq(
                    "user_id",
                    authData.user.id
                )
                .maybeSingle();


        if (roleError) {

            console.error(
                "ROLE ERROR:",
                roleError
            );


            /*
               We don't want to leave the
               user logged in if role checking
               fails.
            */

            await supabaseClient.auth.signOut();


            message.textContent =
                "Unable to verify account type: " +
                roleError.message;


            loginButton.disabled = false;

            return;
        }


        console.log(
            "Account role:",
            roleData
        );


        /* ---------------------------------------------
           STEP 3 — REDIRECT
           --------------------------------------------- */


        if (
            roleData &&
            roleData.role === "admin"
        ) {

            message.textContent =
                "Admin account detected...";


            window.location.href =
                "admin.html";


            return;
        }


        /*
           If the user isn't an admin,
           send them to the member dashboard.
        */


        message.textContent =
            "Member account detected...";


        window.location.href =
            "dashboard.html";

    }
);


</script>


</body>

</html>
