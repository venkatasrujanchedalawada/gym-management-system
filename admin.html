<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AV Fitness | Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
        }

        nav {
            background: #111;
            border-bottom: 1px solid #292929;

            padding: 18px 7%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ff3b30;
        }

        button {
            background: #ff3b30;
            color: white;

            border: none;
            border-radius: 7px;

            padding: 11px 18px;

            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        main {
            width: 86%;
            max-width: 1200px;

            margin: 0 auto;

            padding: 40px 0;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            font-size: 36px;
        }

        .welcome p {
            color: #999;
            margin-top: 8px;
        }

        .stats {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 18px;

            margin-bottom: 25px;
        }

        .stat {
            background: #151515;

            border: 1px solid #292929;
            border-radius: 12px;

            padding: 22px;
        }

        .stat-title {
            color: #999;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
        }

        .section {
            background: #151515;

            border: 1px solid #292929;
            border-radius: 12px;

            padding: 25px;

            margin-bottom: 25px;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;

            margin-bottom: 20px;
        }

        .section-title h2 {
            font-size: 22px;
        }

        .member {
            border-top: 1px solid #292929;

            padding: 17px 0;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;
        }

        .member-name {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .member-details {
            color: #999;
            font-size: 14px;
            line-height: 1.6;
        }

        .active {
            color: #65df83;
            font-weight: bold;
        }

        .expired {
            color: #ff6b6b;
            font-weight: bold;
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            color: #ccc;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;

            padding: 13px;

            background: #0d0d0d;
            color: white;

            border: 1px solid #333;
            border-radius: 7px;

            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #ff3b30;
        }

        .amount-box {
            background: #0d0d0d;

            border: 1px solid #333;
            border-radius: 7px;

            padding: 13px;

            font-weight: bold;
        }

        .form-actions {
            margin-top: 22px;
        }

        .message {
            margin-top: 15px;
            min-height: 20px;
            color: #aaa;
        }

        .loading {
            text-align: center;
            padding: 70px 20px;
            color: #aaa;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 650px) {

            main {
                width: 92%;
            }

            .welcome h1 {
                font-size: 30px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .member {
                flex-direction: column;
                align-items: flex-start;
            }

            .section-title {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


<nav>

    <div class="logo">
        AV <span>FITNESS</span>
    </div>

    <button id="logoutButton">
        Logout
    </button>

</nav>


<div id="loadingScreen" class="loading">

    Checking administrator access...

</div>


<main id="adminPage" class="hidden">


    <!-- HEADER -->

    <div class="welcome">

        <h1>
            Admin Dashboard
        </h1>

        <p>
            Manage AV Fitness
        </p>

    </div>


    <!-- STATISTICS -->

    <div class="stats">


        <div class="stat">

            <div class="stat-title">
                Total Members
            </div>

            <div
                class="stat-number"
                id="totalMembers"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Active Members
            </div>

            <div
                class="stat-number"
                id="activeMembers"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Total Payments
            </div>

            <div
                class="stat-number"
                id="totalPayments"
            >
                0
            </div>

        </div>


    </div>


    <!-- MEMBERS -->

    <section class="section">


        <div class="section-title">

            <h2>
                👥 Members
            </h2>

        </div>


        <div id="memberList">

            <p>
                Loading members...
            </p>

        </div>


    </section>


    <!-- BILLING -->

    <section class="section">


        <div class="section-title">

            <h2>
                💳 New Membership
            </h2>

        </div>


        <form id="membershipForm">


            <div class="form-grid">


                <!-- NAME -->

                <div class="form-group">

                    <label for="memberName">
                        Member Name
                    </label>

                    <input
                        id="memberName"
                        type="text"
                        placeholder="Enter member name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="memberEmail">
                        Email
                    </label>

                    <input
                        id="memberEmail"
                        type="email"
                        placeholder="Enter email"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="memberPhone">
                        Phone
                    </label>

                    <input
                        id="memberPhone"
                        type="tel"
                        placeholder="Enter phone number"
                        required
                    >

                </div>


                <!-- PACKAGE -->

                <div class="form-group">

                    <label for="membershipType">
                        Membership Package
                    </label>

                    <select
                        id="membershipType"
                        required
                    >

                        <option value="">
                            Select package
                        </option>

                        <option
                            value="Monthly"
                            data-price="1499"
                            data-months="1"
                        >
                            Monthly — ₹1,499
                        </option>

                        <option
                            value="Quarterly"
                            data-price="2999"
                            data-months="3"
                        >
                            Quarterly — ₹2,999
                        </option>

                        <option
                            value="Annual"
                            data-price="6999"
                            data-months="12"
                        >
                            Annual — ₹6,999
                        </option>

                    </select>

                </div>


                <!-- PAYMENT METHOD -->

                <div class="form-group">

                    <label for="paymentMethod">
                        Payment Method
                    </label>

                    <select
                        id="paymentMethod"
                        required
                    >

                        <option value="">
                            Select payment method
                        </option>

                        <option value="UPI">
                            UPI
                        </option>

                        <option value="Cash">
                            Cash
                        </option>

                        <option value="Card">
                            Card
                        </option>

                        <option value="Bank Transfer">
                            Bank Transfer
                        </option>

                    </select>

                </div>


                <!-- AMOUNT -->

                <div class="form-group">

                    <label>
                        Amount
                    </label>

                    <div
                        class="amount-box"
                        id="amountDisplay"
                    >
                        ₹0
                    </div>

                </div>


                <!-- FORM BUTTON -->

                <div class="form-group full">

                    <div class="form-actions">

                        <button
                            type="submit"
                            id="createMembershipButton"
                        >
                            Create Membership
                        </button>

                    </div>

                </div>


            </div>


            <p
                id="billingMessage"
                class="message"
            ></p>


        </form>


    </section>


    <!-- TRAINERS -->

    <section class="section">


        <div class="section-title">

            <h2>
                🏋️ Trainers
            </h2>

            <button
                type="button"
                id="trainerButton"
            >
                Manage Trainers
            </button>

        </div>


        <p class="member-details">
            Trainer management will be added next.
        </p>


    </section>


</main>


<script>


/* =====================================================
   SUPABASE CONFIGURATION
   ===================================================== */


const SUPABASE_URL =
    "https://hwcvzgnldnnvpzqaprmr.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable__p2vDp05-aQKlAjGbp8vqw_7c9fyHtK";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =====================================================
   ELEMENTS
   ===================================================== */


const loadingScreen =
    document.getElementById(
        "loadingScreen"
    );


const adminPage =
    document.getElementById(
        "adminPage"
    );


const logoutButton =
    document.getElementById(
        "logoutButton"
    );


const memberList =
    document.getElementById(
        "memberList"
    );


const totalMembers =
    document.getElementById(
        "totalMembers"
    );


const activeMembers =
    document.getElementById(
        "activeMembers"
    );


const totalPayments =
    document.getElementById(
        "totalPayments"
    );


const membershipForm =
    document.getElementById(
        "membershipForm"
    );


const membershipType =
    document.getElementById(
        "membershipType"
    );


const amountDisplay =
    document.getElementById(
        "amountDisplay"
    );


const billingMessage =
    document.getElementById(
        "billingMessage"
    );


/* =====================================================
   CHECK ADMIN
   ===================================================== */


async function checkAdmin() {


    const {
        data: sessionData
    } =
        await supabaseClient.auth
            .getSession();


    const session =
        sessionData.session;


    if (!session) {

        window.location.href =
            "login.html";

        return false;
    }


    const user =
        session.user;


    const {
        data: roleData,
        error: roleError
    } =
        await supabaseClient
            .from("user_roles")
            .select("role")
            .eq(
                "user_id",
                user.id
            )
            .eq(
                "role",
                "admin"
            )
            .maybeSingle();


    if (roleError) {

        console.error(
            "Admin role error:",
            roleError
        );

        loadingScreen.textContent =
            "Unable to verify administrator access.";

        return false;
    }


    if (!roleData) {

        loadingScreen.textContent =
            "Access denied.";

        return false;
    }


    return true;

}


/* =====================================================
   LOAD MEMBERS
   ===================================================== */


async function loadMembers() {


    const {
        data: members,
        error
    } =
        await supabaseClient
            .from("members")
            .select(
                `
                member_id,
                name,
                email,
                phone,
                membership_type,
                membership_end
                `
            )
            .order(
                "member_id",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Members error:",
            error
        );

        memberList.innerHTML =
            "<p>Unable to load members.</p>";

        return;
    }


    totalMembers.textContent =
        members.length;


    const today =
        new Date();


    const active =
        members.filter(
            member =>
                member.membership_end &&
                new Date(
                    member.membership_end
                ) >= today
        );


    activeMembers.textContent =
        active.length;


    if (members.length === 0) {

        memberList.innerHTML =
            "<p>No members yet.</p>";

        return;
    }


    memberList.innerHTML =
        members.map(
            member => {


                const isActive =
                    member.membership_end &&
                    new Date(
                        member.membership_end
                    ) >= today;


                return `

                    <div class="member">

                        <div>

                            <div class="member-name">
                                ${escapeHTML(
                                    member.name
                                )}
                            </div>

                            <div class="member-details">

                                ${escapeHTML(
                                    member.email || ""
                                )}

                                <br>

                                ${escapeHTML(
                                    member.phone || ""
                                )}

                                <br>

                                Package:
                                ${escapeHTML(
                                    member.membership_type || "N/A"
                                )}

                                <br>

                                Expires:
                                ${member.membership_end || "N/A"}

                            </div>

                        </div>

                        <div class="${
                            isActive
                                ? "active"
                                : "expired"
                        }">

                            ${
                                isActive
                                    ? "● Active"
                                    : "● Expired"
                            }

                        </div>

                    </div>

                `;

            }
        ).join("");

}


/* =====================================================
   LOAD PAYMENT COUNT
   ===================================================== */


async function loadPaymentCount() {


    const {
        count,
        error
    } =
        await supabaseClient
            .from("payments")
            .select(
                "payment_id",
                {
                    count: "exact",
                    head: true
                }
            );


    if (error) {

        console.error(
            "Payments error:",
            error
        );

        totalPayments.textContent =
            "—";

        return;
    }


    totalPayments.textContent =
        count || 0;

}


/* =====================================================
   PACKAGE PRICE
   ===================================================== */


membershipType.addEventListener(
    "change",
    function() {


        const option =
            membershipType.options[
                membershipType.selectedIndex
            ];


        const price =
            option.dataset.price;


        amountDisplay.textContent =
            price
                ? "₹" +
                  Number(price)
                    .toLocaleString("en-IN")
                : "₹0";

    }
);


/* =====================================================
   MEMBERSHIP FORM
   ===================================================== */


membershipForm.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        const name =
            document.getElementById(
                "memberName"
            ).value.trim();


        const email =
            document.getElementById(
                "memberEmail"
            ).value.trim();


        const phone =
            document.getElementById(
                "memberPhone"
            ).value.trim();


        const packageOption =
            membershipType.options[
                membershipType.selectedIndex
            ];


        const packageName =
            packageOption.value;


        const amount =
            Number(
                packageOption.dataset.price
            );


        const paymentMethod =
            document.getElementById(
                "paymentMethod"
            ).value;


        if (
            !name ||
            !email ||
            !phone ||
            !packageName ||
            !amount ||
            !paymentMethod
        ) {

            billingMessage.textContent =
                "Please fill in all fields.";

            return;
        }


        billingMessage.textContent =
            "Form validated successfully. Database creation will be connected next.";

    }
);


/* =====================================================
   LOGOUT
   ===================================================== */


logoutButton.addEventListener(
    "click",
    async function() {


        await supabaseClient.auth.signOut();


        window.location.href =
            "login.html";

    }
);


/* =====================================================
   HTML SAFETY
   ===================================================== */


function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =====================================================
   START
   ===================================================== */


async function startAdmin() {


    const isAdmin =
        await checkAdmin();


    if (!isAdmin) {
        return;
    }


    loadingScreen.style.display =
        "none";


    adminPage.classList.remove(
        "hidden"
    );


    await loadMembers();


    await loadPaymentCount();

}


startAdmin();


</script>


</body>

</html>
