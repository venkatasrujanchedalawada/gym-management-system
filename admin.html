<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AV Fitness | Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b0b0b;
            color: white;
        }

        nav {
            background: #111;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .logo span {
            color: #ff3b30;
        }

        button {
            background: #ff3b30;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 40px 8%;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            font-size: 38px;
        }

        .welcome p {
            color: #999;
            margin-top: 8px;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat {
            background: #151515;
            border: 1px solid #292929;
            padding: 25px;
            border-radius: 12px;
        }

        .stat h3 {
            color: #aaa;
            margin-bottom: 10px;
        }

        .stat strong {
            font-size: 32px;
        }

        .section {
            background: #151515;
            border: 1px solid #292929;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .section-header h2 {
            font-size: 22px;
        }

        .member {
            padding: 15px 0;
            border-top: 1px solid #292929;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .member-info strong {
            display: block;
            margin-bottom: 5px;
        }

        .member-info span {
            color: #999;
            font-size: 14px;
        }

        .status {
            color: #72e58a;
        }

        .empty {
            color: #888;
        }

        #loading {
            text-align: center;
            padding: 60px;
            color: #aaa;
        }

        #adminContent {
            display: none;
        }

        @media (max-width: 600px) {
            .member {
                flex-direction: column;
                align-items: flex-start;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
        #membershipForm {
    display: grid;
    gap: 10px;
}

#membershipForm label {
    color: #ccc;
    font-size: 14px;
    margin-top: 8px;
}

#membershipForm input,
#membershipForm select {
    width: 100%;
    padding: 12px;

    background: #0d0d0d;
    color: white;

    border: 1px solid #333;
    border-radius: 7px;
}

#membershipForm input:focus,
#membershipForm select:focus {
    outline: none;
    border-color: #ff3b30;
}

#billingMessage {
    margin-top: 10px;
    color: #aaa;
}
    </style>
</head>

<body>

<nav>

    <div class="logo">
        AV <span>FITNESS</span>
    </div>

    <button id="logoutBtn">
        Logout
    </button>

</nav>


<div id="loading">
    Checking administrator access...
</div>


<main id="adminContent">

    <div class="welcome">

        <h1>Admin Dashboard</h1>

        <p>
            Manage AV Fitness
        </p>

    </div>


    <!-- STATISTICS -->

    <div class="stats">

        <div class="stat">

            <h3>Total Members</h3>

            <strong id="totalMembers">
                0
            </strong>

        </div>


        <div class="stat">

            <h3>Active Members</h3>

            <strong id="activeMembers">
                0
            </strong>

        </div>


        <div class="stat">

            <h3>Trainers</h3>

            <strong>
                Coming soon
            </strong>

        </div>

    </div>


    <!-- MEMBERS -->

    <div class="section">

        <div class="section-header">

            <h2>👥 Members</h2>

            <button id="addMemberBtn">
                + Add Member
            </button>

        </div>

        <div id="memberList">

            <p class="empty">
                Loading members...
            </p>

        </div>

    </div>

<!-- BILLING -->

<div class="section">

    <div class="section-header">

        <h2>💳 New Membership</h2>

    </div>

    <form id="membershipForm">

        <label>Name</label>

        <input
            type="text"
            id="memberName"
            placeholder="Member name"
            required
        >

        <label>Email</label>

        <input
            type="email"
            id="memberEmail"
            placeholder="Member email"
            required
        >

        <label>Phone</label>

        <input
            type="tel"
            id="memberPhone"
            placeholder="Phone number"
            required
        >

        <label>Membership Package</label>

        <select id="membershipType" required>

            <option value="">
                Select package
            </option>

            <option
                value="Monthly"
                data-price="1499"
            >
                Monthly — ₹1,499
            </option>

            <option
                value="Quarterly"
                data-price="2999"
            >
                Quarterly — ₹2,999
            </option>

            <option
                value="Annual"
                data-price="6999"
            >
                Annual — ₹6,999
            </option>

        </select>

        <label>Payment Method</label>

        <select id="paymentMethod" required>

            <option value="">
                Select payment method
            </option>

            <option value="UPI">
                UPI
            </option>

            <option value="Cash">
                Cash
            </option>

            <option value="Card">
                Card
            </option>

            <option value="Bank Transfer">
                Bank Transfer
            </option>

        </select>

        <label>Amount</label>

        <input
            type="number"
            id="paymentAmount"
            placeholder="Amount"
            min="0"
            step="0.01"
            required
        >

        <button type="submit">
            Create Membership
        </button>

        <p id="billingMessage"></p>

    </form>

</div>


    <!-- TRAINERS -->

    <div class="section">

        <div class="section-header">

            <h2>🏋️ Trainers</h2>

            <button id="trainerBtn">
                Manage Trainers
            </button>

        </div>

        <p class="empty">
            Trainer management will be added next.
        </p>

    </div>

</main>


<script>

const SUPABASE_URL =
    "https://hwcvzgnldnnvpzqaprmr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable__p2vDp05-aQKlAjGbp8vqw_7c9fyHtK";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function loadAdminDashboard() {

    /*
       1. Check login
    */

    const {
        data: { user },
        error: authError
    } = await supabaseClient.auth.getUser();


    if (authError || !user) {

        window.location.href =
            "login.html";

        return;
    }


    /*
       2. Check administrator role
    */

    const {
        data: role,
        error: roleError
    } = await supabaseClient
        .from("user_roles")
        .select("role")
        .eq("user_id", user.id)
        .eq("role", "admin")
        .maybeSingle();


    if (roleError || !role) {

        document.getElementById("loading")
            .textContent =
            "Access denied. Administrator account required.";

        return;
    }


    /*
       3. Load members
    */

    const {
        data: members,
        error: membersError
    } = await supabaseClient
        .from("members")
        .select(`
            member_id,
            name,
            email,
            membership_type,
            membership_end
        `)
        .order("member_id", {
            ascending: false
        });


    if (membersError) {

        console.error(membersError);

        document.getElementById("loading")
            .textContent =
            "Unable to load members.";

        return;
    }


    /*
       4. Show dashboard
    */

    document.getElementById("loading")
        .style.display = "none";

    document.getElementById("adminContent")
        .style.display = "block";


    /*
       5. Statistics
    */

    document.getElementById("totalMembers")
        .textContent =
        members.length;


    const today = new Date();

    const activeMembers =
        members.filter(member =>
            member.membership_end &&
            new Date(member.membership_end) >= today
        );


    document.getElementById("activeMembers")
        .textContent =
        activeMembers.length;


    /*
       6. Member list
    */

    const memberList =
        document.getElementById("memberList");


    if (members.length === 0) {

        memberList.innerHTML =
            "<p class='empty'>No members found.</p>";

        return;
    }


    memberList.innerHTML =
        members.map(member => {

            const expiry =
                member.membership_end
                || "Not set";


            const isActive =
                member.membership_end &&
                new Date(member.membership_end)
                >= today;


            return `

                <div class="member">

                    <div class="member-info">

                        <strong>
                            ${member.name}
                        </strong>

                        <span>
                            ${member.email}
                            •
                            ${member.membership_type}
                            •
                            Expires:
                            ${expiry}
                        </span>

                    </div>

                    <div class="status">

                        ${isActive
                            ? "● Active"
                            : "● Expired"}

                    </div>

                </div>

            `;

        }).join("");

}


/*
   Logout
*/

document.getElementById("logoutBtn")
    .addEventListener("click", async () => {

        await supabaseClient.auth.signOut();

        window.location.href =
            "login.html";

    });

const membershipType =
    document.getElementById("membershipType");

const paymentAmount =
    document.getElementById("paymentAmount");


membershipType.addEventListener(
    "change",
    function() {

        const selected =
            membershipType.options[
                membershipType.selectedIndex
            ];

        const price =
            selected.dataset.price;

        if (price) {
            paymentAmount.value = price;
        } else {
            paymentAmount.value = "";
        }

    }
);
const membershipForm =
    document.getElementById("membershipForm");


membershipForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const billingMessage =
            document.getElementById("billingMessage");

        billingMessage.textContent =
            "Billing form is ready. Database creation will be connected next.";

    }
);    
loadAdminDashboard();

</script>

</body>
</html>
